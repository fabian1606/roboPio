; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Aufteilung:
;   - Receiver (Roboter-Seite, Waveshare ESP32) → PIO, dieses Projekt.
;   - Sender (Controller-Seite) → Arduino IDE, distribuiert als ZIP der
;     RobotLink-Library. Die Sketches liegen unter
;     lib/RobotLink/examples/Sender{Direct,Cylindrical,Cartesian}/.
;
; Die Library selbst (lib/RobotLink/) ist Arduino-IDE-1.5-kompatibel und
; wird hier zugleich von PIO als lokale Lib genutzt.

[env:receiver]
; Waveshare "Servo Driver with ESP32" — standard ESP32 (not S3)
platform         = espressif32
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
lib_deps =
    workloads/SCServo@^1.0.1
    fastled/FastLED@~3.9.0
    mattfryer/Smoothed@^1.2
build_src_filter = -<*> +<receiver/>
build_flags      =
    -D ROLE_RECEIVER
    -D ROBOTLINK_LED_PIN=23   ; WS2812B on Waveshare board → IO23
    -D ROBOTLINK_BTN_PIN=0    ; BOOT/KEY_FLASH button → GPIO0
upload_port      = /dev/cu.usbserial-0001

; ── Monitoring-Build ──────────────────────────────────────────────────────────
; Identisch zum Receiver, aber mit -D ROBOLINK_MONITOR: plottet EINE Messgröße
; ALLER 6 Servos (inkl. Greifer = "GRIP") im Serial-Plotter-Format. Nutzen, um
; Überlast zu diagnostizieren, wenn ein Motor seine Endposition nicht erreicht:
;   pio run -e receiver-monitor -t upload -t monitor
; Dann in Arduino IDE / VSCode den Serial Plotter öffnen (115200 Baud).
;
; Der Arduino Serial Plotter zeigt max. 8 Serien → pro Build nur EINE Größe
; (6 Serien). Standard ist der Strom. Zum Umschalten die Zeile unten setzen:
;   -D MONITOR_METRIC=MON_CURRENT   (Standard — Strom / Blockier-Signal)
;   -D MONITOR_METRIC=MON_LOAD      (PWM-Last 0..1000)
;   -D MONITOR_METRIC=MON_TEMP      (Temperatur °C)
[env:receiver-monitor]
extends          = env:receiver
build_flags      =
    ${env:receiver.build_flags}
    -D ROBOLINK_MONITOR
    -D MONITOR_METRIC=MON_CURRENT

; ── Sender (Direktsteuerung) ─────────────────────────────────────────────────
; ESP32-S3-Controller mit 6 Potis → SenderDirect-Beispiel (Mode 1), PIO-Variante.
;   pio run -e sender-direct -t upload -t monitor
[env:sender-direct]
platform         = espressif32
board            = esp32-s3-devkitc-1
framework        = arduino
monitor_speed    = 115200
lib_deps =
    fastled/FastLED@~3.9.0
    mattfryer/Smoothed@^1.2
build_src_filter = -<*> +<sender/>
build_flags      =
    -D ARDUINO_USB_CDC_ON_BOOT=1
upload_port      = /dev/cu.usbmodem11101
monitor_port     = /dev/cu.usbmodem11101
